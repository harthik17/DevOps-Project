apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: "aiops-app"
        metrics_path: /metrics
        static_configs:
          - targets: ["aiops-app:8000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-prometheus
  template:
    metadata:
      labels:
        app: aiops-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: aiops-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-prometheus
spec:
  selector:
    app: aiops-prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: NodePort
