global:
  resolve_timeout: 5m
route:
  receiver: local-webhook
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: local-webhook
    webhook_configs:
      - url: "http://host.docker.internal:8099/alerts"
        send_resolved: true
